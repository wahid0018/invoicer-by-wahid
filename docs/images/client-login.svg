<svg xmlns="http://www.w3.org/2000/svg" width="780" height="1688" viewBox="0 0 390 844" role="img" aria-labelledby="title">
<title id="title">Client sign-in screen visual for Invoicer Business Suite</title>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#e9f5f2"/><stop offset=".55" stop-color="#f5f8fa"/><stop offset="1" stop-color="#e7edf5"/></linearGradient><linearGradient id="btn" x2="1" y2="1"><stop stop-color="#13988e"/><stop offset="1" stop-color="#087e76"/></linearGradient><filter id="shadow" x="-30%" y="-20%" width="160%" height="160%"><feDropShadow dx="8" dy="12" stdDeviation="15" flood-color="#859a9c" flood-opacity=".2"/><feDropShadow dx="-4" dy="-4" stdDeviation="10" flood-color="#fff" flood-opacity=".86"/></filter></defs>
<rect width="390" height="844" fill="url(#bg)"/><circle cx="370" cy="100" r="130" fill="#c4e8e1" opacity=".25"/><circle cx="10" cy="750" r="150" fill="#c9d9eb" opacity=".25"/>
<g font-family="Inter, Segoe UI, Arial, sans-serif" fill="#183038">
  <g transform="translate(35 45)"><rect width="40" height="40" rx="13" fill="url(#btn)"/><text x="20" y="29" text-anchor="middle" font-size="24" font-weight="800" fill="#fff">i</text><text x="51" y="18" font-size="13" font-weight="800" letter-spacing="1.3">INVOICER</text><text x="51" y="33" font-size="7" font-weight="700" letter-spacing="2" fill="#78898e">BUSINESS SUITE</text></g>
  <g filter="url(#shadow)"><rect x="22" y="118" width="346" height="628" rx="24" fill="#fbfcfc"/></g>
  <text x="48" y="181" font-size="23" font-weight="750">Sign in to your workspace</text>
  <text x="48" y="207" font-size="12" fill="#74858a">Access your companies, invoices and business records.</text>
  <text x="48" y="253" font-size="12" font-weight="650">Email address</text><rect x="48" y="264" width="294" height="44" rx="9" fill="#fff" stroke="#dce5e6"/><text x="62" y="291" font-size="12" fill="#a0adb0">you@business.com</text>
  <text x="48" y="340" font-size="12" font-weight="650">Password</text><rect x="48" y="351" width="294" height="44" rx="9" fill="#fff" stroke="#dce5e6"/><text x="63" y="378" font-size="14" letter-spacing="3" fill="#a0adb0">••••••••</text><text x="324" y="378" text-anchor="end" font-size="11" fill="#87989b">Show</text>
  <text x="342" y="420" text-anchor="end" font-size="10" fill="#087e76">Forgot password?</text>
  <rect x="48" y="446" width="294" height="47" rx="10" fill="url(#btn)"/><text x="195" y="475" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">Sign in</text>
  <text x="195" y="522" text-anchor="middle" font-size="10" fill="#8b999c">New to Invoicer?</text>
  <rect x="48" y="541" width="294" height="46" rx="10" fill="#eff5f4" stroke="#dce8e6"/><text x="195" y="569" text-anchor="middle" font-size="12" font-weight="700" fill="#176f69">Create a new account</text>
  <path d="M48 619H342" stroke="#e8eeee"/><circle cx="68" cy="657" r="11" fill="#e0f1ee"/><path d="M63 657l3 3 7-8" fill="none" stroke="#087e76" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="87" y="655" font-size="10" font-weight="600" fill="#607579">Your workspace, available across devices</text><text x="87" y="671" font-size="9" fill="#93a0a3">Secure sign-in · Company-scoped records</text>
</g></svg>
