<svg xmlns="http://www.w3.org/2000/svg" width="780" height="1688" viewBox="0 0 390 844" role="img" aria-labelledby="title">
<title id="title">Client account creation screen visual for Invoicer Business Suite</title>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#e9f5f2"/><stop offset=".55" stop-color="#f5f8fa"/><stop offset="1" stop-color="#e7edf5"/></linearGradient><linearGradient id="btn" x2="1" y2="1"><stop stop-color="#13988e"/><stop offset="1" stop-color="#087e76"/></linearGradient><filter id="shadow" x="-30%" y="-20%" width="160%" height="160%"><feDropShadow dx="8" dy="12" stdDeviation="15" flood-color="#859a9c" flood-opacity=".2"/><feDropShadow dx="-4" dy="-4" stdDeviation="10" flood-color="#fff" flood-opacity=".86"/></filter></defs>
<rect width="390" height="844" fill="url(#bg)"/><circle cx="370" cy="100" r="130" fill="#c4e8e1" opacity=".25"/><circle cx="10" cy="750" r="150" fill="#c9d9eb" opacity=".25"/>
<g font-family="Inter, Segoe UI, Arial, sans-serif" fill="#183038">
  <g transform="translate(35 30)"><rect width="40" height="40" rx="13" fill="url(#btn)"/><text x="20" y="29" text-anchor="middle" font-size="24" font-weight="800" fill="#fff">i</text><text x="51" y="18" font-size="13" font-weight="800" letter-spacing="1.3">INVOICER</text><text x="51" y="33" font-size="7" font-weight="700" letter-spacing="2" fill="#78898e">BUSINESS SUITE</text></g>
  <g filter="url(#shadow)"><rect x="22" y="91" width="346" height="722" rx="24" fill="#fbfcfc"/></g>
  <text x="48" y="145" font-size="24" font-weight="750">Create your account</text>
  <text x="48" y="169" font-size="11" fill="#74858a">Create an account to access your company workspace online.</text>
  <text x="48" y="209" font-size="11" font-weight="650">Your name</text><rect x="48" y="217" width="294" height="38" rx="8" fill="#fff" stroke="#dce5e6"/><text x="60" y="241" font-size="11" fill="#a0adb0">Full name</text>
  <text x="48" y="282" font-size="11" font-weight="650">Email address</text><rect x="48" y="290" width="294" height="38" rx="8" fill="#fff" stroke="#dce5e6"/><text x="60" y="314" font-size="11" fill="#a0adb0">you@business.com</text>
  <text x="48" y="355" font-size="11" font-weight="650">Password</text><rect x="48" y="363" width="294" height="38" rx="8" fill="#fff" stroke="#dce5e6"/><text x="61" y="387" font-size="13" letter-spacing="3" fill="#a0adb0">••••••••</text><text x="48" y="416" font-size="9" fill="#829195">Use at least 8 characters.</text>
  <text x="48" y="453" font-size="11" font-weight="650">Mobile number</text><rect x="48" y="461" width="294" height="38" rx="8" fill="#fff" stroke="#dce5e6"/><text x="60" y="485" font-size="11" fill="#a0adb0">+91 00000 00000</text>
  <text x="48" y="532" font-size="11" font-weight="650">Address</text><rect x="48" y="540" width="294" height="64" rx="8" fill="#fff" stroke="#dce5e6"/><text x="60" y="563" font-size="11" fill="#a0adb0">Business address</text>
  <rect x="48" y="628" width="294" height="45" rx="10" fill="url(#btn)"/><text x="195" y="656" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">Create account</text>
  <text x="195" y="704" text-anchor="middle" font-size="10" fill="#8b999c">Already have an account?</text>
  <rect x="48" y="719" width="294" height="42" rx="10" fill="#eff5f4" stroke="#dce8e6"/><text x="195" y="745" text-anchor="middle" font-size="11" font-weight="700" fill="#176f69">Back to sign in</text>
</g></svg>
