 function openInvoice(existing){currentInvoice=existing||null;page='New invoice';render();window.scrollTo({top:0,behavior:'smooth'});calcTax()}
  function render(){document.getElementById('crumb').textContent=page;document.querySelectorAll('.sidebar nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));document.getElementById('content').innerHTML=page==='Overview'?overview():page==='Invoices'?invoicesPage():page==='New invoice'?invoiceEditor():placeholder(page);if(page==='New invoice'){document.querySelectorAll('.line-qty,.line-rate,.line-discount,.line-tax').forEach(el=>el.addEventListener('input',calcTax));document.querySelectorAll('.line-tax').forEach(el=>el.addEventListener('change',calcTax));document.getElementById('place').addEventListener('change',calcTax);document.querySelector('.round-line input').addEventListener('change',calcTax);calcTax()}}
 function calcTax(){const rows=[...document.querySelectorAll('.invoice-line')];let subtotal=0,discount=0,taxes=0;rows.forEach(row=>{const qty=Number(row.querySelector('.line-qty').value||0),rate=Number(row.querySelector('.line-rate').value||0),disc=Number(row.querySelector('.line-discount').value||0),tax=Number(row.querySelector('.line-tax').value||0);const gross=qty*rate,off=gross*disc/100,net=gross-off,vat=net*tax/100;subtotal+=gross;discount+=off;taxes+=vat;row.querySelector('.line-amount').textContent=fmt(net+vat)});const net=subtotal-discount,inter=document.getElementById('place')?.value==='inter';const roundOn=document.querySelector('.round-line input')?.checked;const rounded=roundOn?Math.round(net+taxes)-(net+taxes):0;const total=net+taxes+rounded;document.getElementById('taxable').textContent=fmt(subtotal);document.getElementById('discountTotal').textContent=fmt(discount);document.getElementById('taxableNet').textContent=fmt(net);document.getElementById('taxRows').innerHTML=inter?`<div class="summary-line"><span>IGST</span><b>${fmt(taxes)}</b></div>`:`<div class="summary-line"><span>CGST</span><b>${fmt(taxes/2)}</b></div><div class="summary-line"><span>SGST</span><b>${fmt(taxes/2)}</b></div>`;document.querySelector('.summary-state').innerHTML=`<span class="state-dot"></span> ${inter?'Inter-state supply':'Intra-state supply'} <span class="auto-tag">AUTO</span>`;document.getElementById('roundoff').textContent=fmt(rounded);document.getElementById('grand').textContent=fmt(total);document.getElementById('words').textContent=total?'Invoice total calculated from current line items':'Zero rupees only'}
 function addLine(){const body=document.getElementById('lines');if(!body)return;const row=body.querySelector('.invoice-line').cloneNode(true);row.querySelector('.line-name').value='';row.querySelector('.line-hsn').value='';row.querySelector('.line-qty').value='1';row.querySelector('.line-rate').value='0';row.querySelector('.line-discount').value='0';row.querySelector('.line-amount').textContent=fmt(0);body.appendChild(row);row.querySelectorAll('.line-qty,.line-rate,.line-discount,.line-tax').forEach(el=>el.addEventListener('input',calcTax));row.querySelector('.line-tax').addEventListener('change',calcTax);row.querySelector('.line-name').focus();calcTax()}
 function removeLine(button){const rows=document.querySelectorAll('.invoice-line');if(rows.length===1){toast('An invoice needs at least one item line');return}button.closest('.invoice-line').remove();calcTax()}
  function saveInvoice(asDraft){const form=document.getElementById('invoiceForm');if(!form?.reportValidity())return;const party=document.getElementById('party').value.trim();const total=Number(document.getElementById('grand').textContent.replace(/[^\d.]/g,''))||0;const dateValue=document.getElementById('invoiceDate').value;const date=dateValue?new Date(dateValue+'T12:00:00').toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}):'02 Oct 2026';const record={no:document.getElementById('invoiceNo').value,party,initials:party.slice(0,2).toUpperCase(),date,amount:total,status:asDraft?'Draft':'Due',agent:'—'};const index=invoices.findIndex(v=>v.no===record.no);if(index>=0)invoices[index]={...invoices[index],...record};else invoices.unshift(record);save();currentInvoice=null;page='Invoices';render();toast(asDraft?'Draft saved on this device':'Invoice saved successfully')}
 function render(){document.getElementById('crumb').textContent=page;document.querySelectorAll('.sidebar nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===(page==='New invoice'?'Invoices':page)));document.getElementById('content').innerHTML=page==='Overview'?overview():page==='Invoices'?invoicesPage():page==='New invoice'?invoiceEditor():placeholder(page);if(page==='New invoice'){document.querySelectorAll('.line-qty,.line-rate,.line-discount,.line-tax').forEach(el=>el.addEventListener('input',calcTax));document.querySelectorAll('.line-tax').forEach(el=>el.addEventListener('change',calcTax));document.getElementById('place').addEventListener('change',calcTax);document.querySelector('.round-line input').addEventListener('change',calcTax);calcTax()}}
